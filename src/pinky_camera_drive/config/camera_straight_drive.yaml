camera_straight_drive:
  ros__parameters:
    camera_topic: /camera/image/compressed
    cmd_vel_topic: /cmd_vel
    odom_topic: /odom

    # ① line follow (old 0.10); code ceiling 0.20.
    linear_speed: 0.20
    max_linear_speed: 0.10
    max_angular_speed: 0.15
    kp: 0.002
    steering_sign: -1.0

    target_distance_m: 0.84
    curve_target_x_m: 0.22
    curve_target_y_m: -0.19
    curve_target_yaw_deg: -60.0
    curve_position_tolerance_m: 0.02
    curve_yaw_tolerance_deg: 3.0
    curve_linear_speed: 0.04
    # ② first-point curve only (old 0.04 / 0.15). Needs ~0.6 rad/s at the
    # sharpest point at 0.10, so the turn cap (not the speed) limits there.
    first_curve_linear_speed: 0.10
    first_curve_max_angular_z: 0.50
    # ⑦ waypoint -> STATION curve only (old 0.04 / 0.15). It ends at the path
    # end (~27.5/19.2 cm, not 31/18); sim: that stop point moves < 3 mm.
    station_curve_linear_speed: 0.10
    station_curve_max_angular_z: 0.50
    curve_min_linear_speed: 0.015
    curve_kp_position: 1.5
    curve_kp_yaw: 0.8
    curve_start_handle_m: 0.13
    curve_end_handle_m: 0.09
    curve_lookahead_m: 0.05
    curve_sample_count: 121
    curve_timeout_sec: 20.0
    curve_max_travel_m: 0.70
    station_stop_duration_sec: 3.5
    test_forward_mode: false
    test_forward_distance_m: 0.08
    test_forward_speed: 0.04
    test_forward_timeout_sec: 5.0
    test_forward_max_travel_m: 0.12
    station_target_forward_m: 0.31
    station_target_right_m: 0.18
    station_target_yaw_deg: -70.0
    station_direct_mode: false
    waypoint_station_mode: true
    station_direct_start_handle_m: 0.15
    station_direct_end_handle_m: 0.10
    station_waypoint_forward_m: 0.17
    station_waypoint_right_m: 0.00
    station_waypoint_yaw_deg: -25.0
    station_waypoint_test_mode: false
    waypoint_forward_only_test_mode: false
    waypoint_forward_rotate_test_mode: false
    waypoint_forward_rotate_test_distance_m: 0.10
    waypoint_forward_rotate_test_angle_deg: 45.0
    waypoint_forward_rotate_test_max_deg: 50.0
    waypoint_test_forward_distance_m: 0.10
    # ④ 0.10 m straight (old: constant 0.04): ramp up 0.3 m/s^2 to 0.10, brake
    # to 0.02 at the target, heading held. Sim: same stop error as before.
    waypoint_test_forward_speed: 0.10
    waypoint_forward_accel: 0.3
    waypoint_forward_min_speed: 0.02
    waypoint_test_forward_timeout_sec: 8.0
    waypoint_test_forward_max_travel_m: 0.22
    waypoint_test_rotate_deg: 45.0
    # ⑤ 45 deg turn (old: constant 0.15): ramp 1.0 rad/s^2 to 0.60, brake to
    # 0.08 at the target. Code ceiling 0.60.
    waypoint_test_rotate_speed: 0.60
    waypoint_rotate_accel: 1.0
    waypoint_rotate_min_speed: 0.08
    waypoint_test_rotate_timeout_sec: 8.0
    waypoint_test_rotate_max_deg: 50.0
    waypoint_pose_settle_sec: 0.5
    station_waypoint_position_tolerance_m: 0.02
    station_waypoint_yaw_tolerance_deg: 3.0
    station_waypoint_start_handle_m: 0.081
    station_waypoint_end_handle_m: 0.051
    station_waypoint_timeout_sec: 12.0
    station_waypoint_max_travel_m: 0.30
    station_start_handle_m: 0.16
    station_end_handle_m: 0.08
    station_overshoot_tolerance_m: 0.01
    station_final_approach_max_m: 0.20
    station_final_approach_enabled: false
    station_final_approach_timeout_sec: 10.0
    station_final_approach_speed: 0.015
    station_final_approach_max_angular: 0.05
    station_timeout_sec: 25.0
    station_max_travel_m: 0.85
    manual_station_departure: true
    # pinky_drive_test (step_mode): run ①~⑦ without stopping (STATION always
    # waits for ENTER), then stop before ⑩, ⑪, ⑫. 0 = stop before every leg.
    step_from_leg: 10
    use_harvest_action: true
    harvest_target_count: 1
    next_stop_target_forward_m: 0.30
    next_stop_target_right_m: 0.29
    next_stop_target_yaw_deg: -90.0
    next_stop_linear_speed: 0.10
    next_stop_start_handle_m: 0.22
    next_stop_end_handle_m: 0.14
    # ⑨ only (①~⑧ keep max_angular_speed 0.15). Code ceiling 0.60 rad/s.
    next_stop_max_angular_z: 0.50
    next_stop_max_angular_accel: 1.00
    # ⑨ slows to position_error * gain near the stop (②/⑤/⑥ use 0.8).
    next_stop_goal_slowdown_gain: 1.5
    # ⑩ after ⑨: stop next_stop_wait_sec, then this curve from the ⑨ pose,
    # with ⑨'s speed/turn limits. Handles 0.094 = smoothest for 0.17/0.17.
    next_stop_wait_sec: 3.5
    next_stop2_target_forward_m: 0.17
    next_stop2_target_right_m: 0.17
    next_stop2_target_yaw_deg: -85.0
    next_stop2_start_handle_m: 0.094
    next_stop2_end_handle_m: 0.094
    # ⑪ after ⑩: follow the left yellow line like ① (2x ① speed) for
    # final_camera_distance_m, then ⑫. Code ceiling 0.20 m/s.
    final_camera_distance_m: 0.45
    final_camera_linear_speed: 0.20
    # ⑪ start without a line: stay stopped and wait this long for a fit
    # (blur after ⑩ / adaptive HSV settling), then drive on holding heading.
    final_camera_detect_timeout_sec: 2.0
    # Lost line while driving: hold the heading at the moment it was lost and
    # return to line following as soon as it is back. ① FAULTs after this many
    # seconds without the line; ⑪ never FAULTs on it (⑫ is odom-only anyway).
    # (old 0.3) 1.0 s at ① 0.20 m/s = up to 20 cm on odom heading only.
    camera_line_loss_hold_sec: 1.0
    # ⑫ after ⑪: odom straight holding ⑫'s start heading, same speed as ⑪,
    # then FINAL_REACHED. Timeout = FAULT (e.g. wheels blocked).
    final_straight_distance_m: 0.45
    final_straight_linear_speed: 0.20
    final_straight_timeout_sec: 8.0
    target_x: 320.0
    # Expected fitted boundary x when the supplied calibration image is centered.
    boundary_reference_x: 23.0
    boundary_eval_y_ratio: 0.80

    roi_top_ratio: 0.65
    roi_left_ratio: 0.0
    roi_right_ratio: 0.70

    yellow_h_low: 22
    yellow_h_high: 32
    yellow_s_low: 111
    yellow_s_high: 191
    yellow_v_low: 130
    yellow_v_high: 200
    # HSV found no line in a frame -> retry the same fit on a Lab mask:
    # b* >= b_low (yellowness, little shadow/glare effect), a* <= a_high (not
    # orange/red). Log shows "yellow line source: LAB" when it takes over.
    # Grey floor b* ~135, shadowed yellow ~150. false = HSV only (legacy).
    yellow_lab_fallback_enabled: true
    yellow_lab_b_low: 145
    yellow_lab_a_high: 140
    # Runtime-only S/V widening around the yellow_* calibration (H never
    # changes, YAML is never rewritten). false = exact legacy thresholds.
    hsv_adaptive_enabled: true
    hsv_adaptive_ema_alpha: 0.05
    hsv_adaptive_v_max_offset: 35
    hsv_adaptive_s_max_offset: 20
    # 0.0 = use the scene brightness of the first frames after start-up.
    hsv_adaptive_reference_v: 0.0
    hsv_adaptive_roi_y_ratio: 0.65
    min_boundary_area: 180.0
    min_boundary_height_ratio: 0.25
    min_line_points: 25
    line_fit_max_residual_px: 12.0

    frame_timeout_sec: 0.5
    odom_timeout_sec: 0.5
    control_rate_hz: 20.0
    frame_log_interval_sec: 5.0
