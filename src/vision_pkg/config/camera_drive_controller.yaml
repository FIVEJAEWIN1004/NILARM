camera_drive_controller:
  ros__parameters:
    camera_topic: /camera/image_raw
    nav_cmd_topic: /cmd_vel_nav_smoothed
    output_cmd_topic: /cmd_vel
    debug_image_topic: /vision_drive/debug_image
    enabled: false

    near_roi_top: 0.68
    near_roi_bottom: 0.95
    far_roi_top: 0.43
    far_roi_bottom: 0.67

    # Initial ranges only. Calibrate these from real arena images.
    road_hsv_lower: [0, 0, 120]
    road_hsv_upper: [179, 95, 255]
    stop_hsv_lower: [5, 45, 40]
    stop_hsv_upper: [35, 255, 220]
    morph_kernel: 5
    min_road_width_ratio: 0.18
    min_stop_area_ratio: 0.015

    center_kp: 0.22
    curve_kp: 0.14
    stop_kp: 0.25
    linear_speed: 0.05
    angular_limit: 0.30
    stop_align_speed: 0.018

    # Normalized gap between the STOP bounding-box bottom and image bottom.
    stop_distance: 0.12
    stop_center_tolerance: 0.06
    stop_hold_sec: 0.5
    stop_debounce_frames: 3
    image_timeout_sec: 0.5
    nav_cmd_timeout_sec: 0.5
    road_loss_timeout_sec: 0.7
